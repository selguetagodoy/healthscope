name: Publish HealthScope

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "tests/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/monitor-sources.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether GitHub Pages is configured for Actions
        id: pages-check
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const response = await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
              const enabled = response.data.build_type === 'workflow';
              core.setOutput('enabled', enabled ? 'true' : 'false');
              core.info(enabled ? 'GitHub Pages is configured for Actions.' : 'GitHub Pages exists, but its source is not GitHub Actions.');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('enabled', 'false');
                core.info('GitHub Pages has not been enabled for this repository yet.');
              } else {
                throw error;
              }
            }
      - name: Explain required Pages setting
        if: steps.pages-check.outputs.enabled != 'true'
        run: |
          {
            echo "## GitHub Pages setup required"
            echo "The site files and deployment workflow are ready. In repository Settings → Pages, set the publishing source to **GitHub Actions**, then rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check out repository
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import public EPOF catalogue if missing
        if: steps.pages-check.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ ! -s data/epof.json ]; then
            if python scripts/import_epof.py; then
              python scripts/validate_data.py
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add data/epof.json
              git commit -m 'Import validated national EPOF nomenclature'
              git pull --rebase origin main
              git push origin HEAD:main
            else
              echo '::warning::EPOF catalogue unavailable; publish explicit pending state.'
            fi
          fi
      - name: Import clinical, patent and procurement data
        if: steps.pages-check.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ ! -s data/clinical-trials.json ] || [ ! -s data/patents.json ] || [ ! -s data/procurement.json ]; then
            python -m pip install -r requirements-intelligence.txt
            python scripts/import_intelligence.py --months 2026-10 2026-09 2026-08 || echo '::warning::Some public datasets unavailable; see bulk-status.json.'
            python scripts/validate_data.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            for path in data/clinical-trials.json data/patents.json data/procurement.json data/procurement-lines.csv data/bulk-status.json; do
              if [ -f "$path" ]; then git add "$path"; fi
            done
            if ! git diff --cached --quiet; then
              git commit -m 'Import public clinical, patent and procurement snapshots'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Validate data and assemble site
        if: steps.pages-check.outputs.enabled == 'true'
        run: |
          python -m unittest discover -s tests
          python scripts/validate_data.py
          python scripts/build_site.py
      - name: Configure Pages
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for Pages artifact registration
        if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 15; attempt++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100});
              if (result.data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) {
                core.info('Pages artifact registered.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Pages artifact did not register in the Actions API.');
      - name: Deploy to GitHub Pages
        if: steps.pages-check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
