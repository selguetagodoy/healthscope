name: Monitor official health sources

on:
  schedule:
    # Santiago alternates between UTC-3 and UTC-4. The local-time guard in the
    # collector selects 08:00, 12:00 and 16:30 in either season.
    - cron: "0,30 11,12,15,16,19,20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture official source updates for review
        id: collect
        run: python scripts/monitor_sources.py
      - name: Validate captured data
        if: always()
        run: python scripts/validate_data.py
      - name: Commit monitoring snapshot
        id: commit
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- data/pending.json data/monitoring.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending.json data/monitoring.json
          git commit -m "Update official-source monitoring snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Check whether GitHub Pages is configured for Actions
        id: pages-check
        if: success() && steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const response = await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
              core.setOutput('enabled', response.data.build_type === 'workflow' ? 'true' : 'false');
            } catch (error) {
              if (error.status === 404) core.setOutput('enabled', 'false');
              else throw error;
            }
      - name: Set up Python for deployment
        if: success() && steps.commit.outputs.changed == 'true' && steps.pages-check.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare site
        if: success() && steps.commit.outputs.changed == 'true' && steps.pages-check.outputs.enabled == 'true'
        run: python scripts/build_site.py
      - name: Configure Pages
        if: success() && steps.commit.outputs.changed == 'true' && steps.pages-check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: success() && steps.commit.outputs.changed == 'true' && steps.pages-check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy updated site
        if: success() && steps.commit.outputs.changed == 'true' && steps.pages-check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
