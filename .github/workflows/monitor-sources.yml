name: Monitor official health sources

on:
  # Run a live check when this collector or an endpoint is changed.
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor-sources.yml"
      - "data/sources.json"
      - "scripts/monitor_sources.py"
      - "scripts/weekly_brief.py"
      - "requirements-weekly.txt"
  schedule:
    # Three-hour weekday cuts; daily weekend cut. UTC is stable across DST.
    - cron: "17 11,14,17,20,23 * * 1-5"
    - cron: "17 15 * * 0,6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture official source updates for review
        id: collect
        run: python scripts/monitor_sources.py
      - name: Generate weekly intelligence and check official editions
        if: always()
        run: |
          python -m pip install -r requirements-weekly.txt
          python scripts/weekly_brief.py
      - name: Validate captured data
        if: always()
        run: python scripts/validate_data.py
      - name: Commit monitoring snapshot
        id: commit
        if: success()
        shell: bash
        run: |
          if git diff --quiet -- data/pending.json data/monitoring.json data/weekly-extra.json data/weekly-brief.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending.json data/monitoring.json data/weekly-extra.json data/weekly-brief.json
          git commit -m "Update official-source monitoring snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish through the canonical deployment workflow
        if: success() && steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
