name: Validate HealthScope data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run source-monitor tests
        run: python -m unittest discover -s tests
      - name: Validate public datasets
        run: python scripts/validate_data.py
      - name: Build static publication
        run: python scripts/build_site.py
